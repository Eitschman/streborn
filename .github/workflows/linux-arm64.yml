name: Linux ARM64 desktop (experimental)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-arm64.yml'
      - 'desktop-app/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop-app/go.mod
          cache-dependency-path: |
            go.sum
            desktop-app/go.sum
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-app/frontend/package-lock.json
      - name: Install Wails CLI
        run: |
          WAILS_VERSION="$(cd desktop-app && go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build ARMv7 agent and Windows helper for embedding
        run: |
          make winformat-embed agent-embed
      - name: Build native Linux ARM64 desktop
        working-directory: desktop-app
        run: wails build -tags webkit2_41 -trimpath -clean -nopackage
      - name: Package binary
        run: |
          mkdir -p dist
          find desktop-app/build/bin -maxdepth 1 -type f -exec file {} \;
          tar -czf dist/STR-Linux-arm64.tar.gz -C desktop-app/build/bin .
      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: STR-Linux-arm64
          path: dist/STR-Linux-arm64.tar.gz
          if-no-files-found: error
