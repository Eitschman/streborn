name: flatpak

# Builds the Flathub package from packaging/flatpak the way Flathub's own
# builders do, runs Flathub's linter over it, and checks that the app finds
# every library it needs inside the GNOME runtime. The real publishing happens
# on Flathub (packaging/README.md); this only catches a broken manifest before
# it gets there.
on:
  pull_request:
    paths:
      - packaging/flatpak/**
      - packaging/linux/**
      - .github/workflows/flatpak.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # gnome-48, pinned by digest
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:50fea670968fd3ec4aeeb3a91d9d807d0af6eab3c3b44c33d4c40c311832c8fa
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the manifest and the metainfo
        run: |
          flatpak-builder-lint manifest packaging/flatpak/de.st_reborn.STReborn.yml || true
          flatpak-builder-lint appstream packaging/flatpak/de.st_reborn.STReborn.metainfo.xml || true

      - name: Build
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=repo --install build-dir packaging/flatpak/de.st_reborn.STReborn.yml

      - name: Every library the app links is in the runtime
        run: |
          out=$(flatpak run --command=sh de.st_reborn.STReborn -c 'ldd /app/bin/st-reborn')
          echo "$out"
          if echo "$out" | grep "not found"; then
            echo "::error::the app needs a library the GNOME runtime does not have"
            exit 1
          fi

      - name: Lint the built repo
        # Reported, not enforced yet: the first Flathub review decides which of
        # its findings matter (screenshots, the bus name), see packaging/README.md.
        run: flatpak-builder-lint repo repo || true

      - name: Bundle
        run: flatpak build-bundle repo st-reborn.flatpak de.st_reborn.STReborn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: st-reborn-flatpak
          path: st-reborn.flatpak
          retention-days: 14
