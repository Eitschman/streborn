# Flathub manifest for the ST Reborn desktop app.
#
# It repackages the Linux archive of the GitHub release instead of building
# from source, on purpose: the app embeds the speaker agent it installs and
# updates over the air, and both must come out of the same release pipeline
# with the same build stamp, or every speaker looks permanently out of date to
# its own app (see CLAUDE.md, "Build version stamping"). The archive is the
# one users get from the website, with its Sigstore attestation.
#
# flatpak-external-data-checker (x-checker-data) opens the update pull request
# on Flathub when a new release is out. packaging/README.md has the steps.
app-id: de.st_reborn.STReborn
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: st-reborn
finish-args:
  # The speakers are on the local network: discovery over mDNS, control and
  # the agent install over HTTP.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Wails keeps one window per user through this session-bus name; a second
  # start hands over to the running one instead of opening twice.
  - --own-name=org.wails_app_de_st_reborn_desktop_singleinstance.SingleInstance
  # The USB stick is the fallback install path, mounted under one of these.
  - --filesystem=/media
  - --filesystem=/run/media
  # Diagnostic bundles and other files the app saves land here.
  - --filesystem=xdg-download
modules:
  - name: st-reborn
    buildsystem: simple
    build-commands:
      - install -Dm755 STR-Linux-* /app/bin/st-reborn
      - install -Dm644 de.st_reborn.STReborn.desktop /app/share/applications/de.st_reborn.STReborn.desktop
      - install -Dm644 de.st_reborn.STReborn.metainfo.xml /app/share/metainfo/de.st_reborn.STReborn.metainfo.xml
      - install -Dm644 st-reborn-128.png /app/share/icons/hicolor/128x128/apps/de.st_reborn.STReborn.png
      - install -Dm644 st-reborn-256.png /app/share/icons/hicolor/256x256/apps/de.st_reborn.STReborn.png
      - install -Dm644 st-reborn-512.png /app/share/icons/hicolor/512x512/apps/de.st_reborn.STReborn.png
      - install -Dm644 LICENSE /app/share/licenses/de.st_reborn.STReborn/LICENSE
      - install -Dm644 NOTICE /app/share/licenses/de.st_reborn.STReborn/NOTICE
      - install -Dm644 THIRD-PARTY-NOTICES.md /app/share/licenses/de.st_reborn.STReborn/THIRD-PARTY-NOTICES.md
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/JRpersonal/streborn/releases/download/v1.0.12/STR-Linux-x64.tar.gz
        sha256: 9365df8c2fc5e36c08c11aa2b5aab1b9d259c0d2e2b26091fd865492188c6f24
        strip-components: 0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/JRpersonal/streborn/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="STR-Linux-x64.tar.gz") | .browser_download_url
      # aarch64 joins with the first release that carries STR-Linux-arm64.tar.gz:
      # - type: archive
      #   only-arches: [aarch64]
      #   url: https://github.com/JRpersonal/streborn/releases/download/<tag>/STR-Linux-arm64.tar.gz
      #   sha256: <from SHA256SUMS>
      #   strip-components: 0
      #   x-checker-data: (as above, with STR-Linux-arm64.tar.gz)
      - type: file
        path: de.st_reborn.STReborn.desktop
      - type: file
        path: de.st_reborn.STReborn.metainfo.xml
      - type: file
        path: ../linux/icons/st-reborn-128.png
      - type: file
        path: ../linux/icons/st-reborn-256.png
      - type: file
        path: ../linux/icons/st-reborn-512.png
